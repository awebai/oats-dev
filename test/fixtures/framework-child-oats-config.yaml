# Child override committed IN the oats/ framework repository after migration.
#
# It carries ONLY the framework-repository-specific behavior that must not reach
# sibling package experts: the framework-workspace instruction injection (a
# repo-relative path that resolves inside oats/, and would mis-resolve/mis-target
# from a non-Git root). All common team policy — families, OKF knowledge, aweb
# messaging, tasks none, authoring→framework-authors, review→developers,
# worktree mode, default OATS policy — is inherited from the adopted root
# oats.dev profile. The operator adds the resolved team id and any auth to the
# local snapshot only, never here.
name: awebai

# Extra unconditional instruction block for every instance operating inside oats/.
agents-md-injection:
  framework: injects/framework-workspace.md
